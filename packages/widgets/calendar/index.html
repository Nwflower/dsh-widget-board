<div class="t-data calendar-card">
  <header class="t-data__head">
    <div>
      <p class="t-data__kicker" data-field="kicker">CALENDAR · 09</p>
      <h2 class="t-data__title" data-field="title">日程</h2>
    </div>
    <span class="t-data__meta" data-field="meta">0 EVENTS</span>
  </header>
  <div class="t-data__body calendar-card__body">
    <div class="calendar-card__bar">
      <span class="calendar-card__month" data-field="month">2026年10月</span>
      <div class="calendar-card__nav">
        <button type="button" class="calendar-card__step" data-step="-1" data-field="previous" aria-label="上个月">‹</button>
        <button type="button" class="calendar-card__today" data-role="today">今天</button>
        <button type="button" class="calendar-card__step" data-step="1" data-field="next" aria-label="下个月">›</button>
      </div>
    </div>
    <div class="calendar-card__weekdays" data-role="weekdays" aria-hidden="true"></div>
    <div class="calendar-card__grid" data-role="grid" role="grid"></div>
  </div>
</div>
