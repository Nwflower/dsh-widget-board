<div class="t-data cal" data-role="cal">
  <header class="t-data__head cal-head">
    <div class="cal-head__text">
      <p class="t-data__title cal-month">
        <span data-field="month">十月</span>
        <span class="cal-month__year" data-field="year">2026</span>
        <span class="cal-nav" data-role="nav">
          <button type="button" class="cal-btn cal-btn--step" data-step="-1" aria-label="上个月">‹</button>
          <button type="button" class="cal-btn cal-btn--today" data-role="today">今天</button>
          <button type="button" class="cal-btn cal-btn--step" data-step="1" aria-label="下个月">›</button>
        </span>
      </p>
      <p class="t-data__kicker cal-sub" data-field="sub">农历九月 · 丙午马年</p>
    </div>
  </header>

  <div class="t-data__body cal-pane">
    <div class="cal-week" data-role="week" aria-hidden="true"></div>
    <div class="cal-grid" data-role="grid" role="grid" aria-label="月历"></div>
    <div class="cal-editor" data-role="editor" hidden>
      <span class="cal-editor__date" data-role="editor-date"></span>
      <input class="cal-editor__input" data-role="editor-input" type="text" maxlength="120" placeholder="添加日程…" autocomplete="off" enterkeyhint="done">
      <button class="cal-editor__btn" type="button" data-role="editor-save">保存</button>
      <button class="cal-editor__btn" type="button" data-role="editor-clear">清除</button>
      <button class="cal-editor__btn cal-editor__close" type="button" data-role="editor-close" aria-label="关闭">×</button>
    </div>
  </div>
</div>
