<div class="t-data clock-card">
  <header class="t-data__head">
    <div>
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">本地时间</h2>
    </div>
    <span class="t-data__meta" data-field="meta"></span>
  </header>
  <div class="t-data__body clock-card__body">
    <div class="clock-card__face">
      <div class="clock-card__time" data-role="time"></div>
      <p class="clock-card__date" data-field="date"></p>
    </div>
  </div>
</div>
