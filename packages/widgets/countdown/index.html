<div class="t-data countdown-card" data-phase="empty">
  <header class="t-data__head">
    <div class="countdown-card__heading">
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">倒数日</h2>
    </div>
    <span class="t-data__meta" data-field="target"></span>
  </header>
  <div class="t-data__body countdown-card__body">
    <div class="countdown-card__units" data-role="units" role="timer" aria-live="off">
      <div class="countdown-card__unit">
        <span class="countdown-card__value" data-role="days">0</span>
        <span class="countdown-card__label" data-field="days-label">天</span>
      </div>
      <div class="countdown-card__unit">
        <span class="countdown-card__value" data-role="hours">00</span>
        <span class="countdown-card__label" data-field="hours-label">小时</span>
      </div>
      <div class="countdown-card__unit">
        <span class="countdown-card__value" data-role="minutes">00</span>
        <span class="countdown-card__label" data-field="minutes-label">分钟</span>
      </div>
    </div>
    <p class="countdown-card__note w-hide-short" data-field="note"></p>
    <p class="countdown-card__hint w-hide-short" data-field="hint"></p>
    <p class="t-data__empty" data-role="empty" hidden>还没设日期，在设置里填一个</p>
    <p class="w-sr" data-field="summary"></p>
  </div>
</div>
