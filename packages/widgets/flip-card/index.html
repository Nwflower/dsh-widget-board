<div class="flip-card t-flip-card" data-t-flip role="button" tabindex="0" aria-pressed="false">
  <div class="t-flip-card__inner">
    <section class="t-flip-card__face flip-card__front">
      <span class="flip-card__kicker" data-field="frontKicker"></span>
      <h2 class="flip-card__title" data-field="frontTitle">一张会翻面的卡片</h2>
      <p class="flip-card__text" data-field="frontText">正面写结论，背面写理由。</p>
      <span class="flip-card__hint" data-field="hint">悬停或轻点翻转</span>
    </section>
    <section class="t-flip-card__face t-flip-card__back flip-card__back">
      <span class="flip-card__kicker" data-field="backKicker"></span>
      <h2 class="flip-card__title" data-field="backTitle">为什么</h2>
      <p class="flip-card__text" data-field="backText">细节、清单或下一步，都放在这一面。</p>
      <span class="flip-card__hint" data-field="backHint">翻回正面</span>
    </section>
  </div>
</div>
