<div class="t-data fortune-card">
  <header class="t-data__head fortune-card__head">
    <div>
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">今日运势</h2>
    </div>
  </header>
  <div class="t-data__body fortune-card__body">
    <div class="fortune-card__hero">
      <span class="fortune-card__seal" data-field="seal" data-tone="idle">平</span>
      <span class="fortune-card__score" data-field="score">52</span>
      <span class="fortune-card__unit">分</span>
      <span class="fortune-card__day" data-field="day">十月十一 · 丙午马年</span>
    </div>
    <div class="fortune-card__meter" role="presentation">
      <span class="fortune-card__fill" data-role="fill"></span>
    </div>
    <p class="fortune-card__line" data-field="line">黑道日，诸事宜守成</p>
    <dl class="fortune-card__facts">
      <div><dt>节气</dt><dd data-field="jieqi"></dd></div>
      <div><dt>建除</dt><dd data-field="zhixing"></dd></div>
      <div><dt>星宿</dt><dd data-field="xiu"></dd></div>
      <div><dt>值神</dt><dd data-field="tianshen"></dd></div>
    </dl>
    <div class="fortune-card__almanac">
      <div class="fortune-card__row">
        <span class="fortune-card__tag" data-kind="yi" data-field="yiTag">宜</span>
        <span class="fortune-card__list" data-field="yi"></span>
      </div>
      <div class="fortune-card__row">
        <span class="fortune-card__tag" data-kind="ji" data-field="jiTag">忌</span>
        <span class="fortune-card__list" data-field="ji"></span>
      </div>
    </div>
    <p class="fortune-card__note" data-field="note"></p>
    <p class="w-sr" data-field="spoken"></p>
  </div>
</div>
