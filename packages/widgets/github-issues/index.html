<div class="t-data gh">
  <header class="t-data__head">
    <div>
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">今日宜休</h2>
    </div>
    <div class="gh__head-aside">
      <span class="t-data__meta gh__account" data-field="account"></span>
      <button class="gh__refresh t-pressable" type="button" data-field="refresh" aria-label="重新读一次" title="重新读一次" data-tip="重新读一次">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V6h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="gh__body">
    <div class="gh__count" data-role="count" hidden></div>
    <div class="gh__list" data-role="list" hidden></div>
    <p class="gh__note t-data__empty" data-role="note">读取 issue…</p>
  </div>

  <p class="w-sr" data-field="sr" aria-live="polite"></p>
</div>
