<div class="t-data heatmap-card">
  <header class="t-data__head">
    <div>
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">活动</h2>
    </div>
    <span class="t-data__meta" data-field="meta"></span>
  </header>
  <div class="t-data__body heatmap-card__body">
    <div class="heatmap-card__frame" data-role="frame">
      <div class="heatmap-card__grid" data-role="grid" role="img"></div>
    </div>
    <p class="t-data__empty" data-role="empty" hidden>暂无记录</p>
    <div class="heatmap-card__foot" data-role="foot">
      <p class="heatmap-card__caption" data-field="caption"></p>
      <div class="heatmap-card__legend" aria-hidden="true">
        <span class="heatmap-card__legend-label" data-field="less">少</span>
        <span class="heatmap-card__swatch" data-level="0"></span>
        <span class="heatmap-card__swatch" data-level="1"></span>
        <span class="heatmap-card__swatch" data-level="2"></span>
        <span class="heatmap-card__swatch" data-level="3"></span>
        <span class="heatmap-card__swatch" data-level="4"></span>
        <span class="heatmap-card__legend-label" data-field="more">多</span>
      </div>
    </div>
  </div>
</div>
