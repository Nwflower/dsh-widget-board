<div class="t-data t-data--split usage-card">
  <header class="t-data__head usage-card__head">
    <div class="usage-card__headline">
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">用量统计</h2>
    </div>
    <p class="usage-card__total">
      <span class="usage-card__total-label" data-field="totalLabel">Token 总量</span>
      <span class="usage-card__total-value" data-field="total">—</span>
    </p>
    <span class="t-data__meta" data-field="meta"></span>
  </header>
  <div class="t-data__body usage-card__body">
    <div class="usage-card__heat" data-role="heat">
      <div class="usage-card__grid" data-role="grid" role="img"></div>
    </div>
    <p class="t-data__empty" data-role="empty" hidden>还没有用量记录</p>
  </div>
  <div class="usage-card__tip" data-role="tip" aria-hidden="true"></div>
</div>
