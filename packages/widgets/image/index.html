<div class="t-data image-card">
  <header class="t-data__head">
    <div>
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">今日一图</h2>
    </div>
    <span class="t-data__meta" data-field="meta"></span>
  </header>
  <div class="t-data__body image-card__body">
    <div class="image-card__frame">
      <div class="image-card__cover" data-role="cover" role="img" hidden></div>
      <img class="image-card__img" data-role="img" alt="" hidden>
      <div class="image-card__placeholder" data-role="placeholder">
        <span class="image-card__mark" aria-hidden="true"></span>
        <span data-role="empty">还没有图片</span>
      </div>
    </div>
    <p class="image-card__caption" data-field="caption"></p>
  </div>
</div>
