<div class="lamp" data-mode="light" data-ready="false" role="switch" aria-checked="false" tabindex="0" aria-label="切换深色与浅色模式">
  <div class="lamp__room" aria-hidden="true">
    <span class="lamp__night-wall"></span>
    <span class="lamp__window">
      <span class="lamp__sky"></span>
      <span class="lamp__night"></span>
      <span class="lamp__sun"></span>
      <span class="lamp__moon"></span>
      <span class="lamp__stars">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </span>
      <span class="lamp__cloud"></span>
      <span class="lamp__mullion"></span>
    </span>
    <span class="lamp__halo"></span>
    <span class="lamp__floor"></span>
  </div>

  <div class="lamp__beam" aria-hidden="true">
    <i class="lamp__mote"></i><i class="lamp__mote"></i><i class="lamp__mote"></i><i class="lamp__mote"></i>
    <i class="lamp__mote"></i><i class="lamp__mote"></i><i class="lamp__mote"></i>
  </div>

  <div class="lamp__stage t-magnetic" data-t-magnetic aria-hidden="true">
    <div class="lamp__fixture">
      <span class="lamp__head">
        <span class="lamp__shade"><span class="lamp__shade-in"></span></span>
        <span class="lamp__bulb"></span>
        <span class="lamp__pull"><i></i><i></i><i></i><i></i></span>
      </span>
      <span class="lamp__neck"></span>
      <span class="lamp__post"></span>
      <span class="lamp__base">
        <span class="lamp__rocker"><span class="lamp__lever"></span></span>
        <span class="lamp__led"></span>
      </span>
    </div>
  </div>

  <div class="lamp__hud">
    <span class="lamp__kicker">外观</span>
    <span class="lamp__titles">
      <span class="lamp__title" data-when="light">日间</span>
      <span class="lamp__title" data-when="dark">夜间</span>
    </span>
    <span class="lamp__meta">
      <span data-when="light">浅色</span>
      <span data-when="dark">深色</span>
    </span>
    <span class="lamp__hints">
      <span class="lamp__hint" data-when="light">轻点开灯，进入夜间</span>
      <span class="lamp__hint" data-when="dark">轻点熄灯，回到日间</span>
    </span>
  </div>

  <div class="lamp__foot">
    <span class="lamp__error" role="status"></span>
  </div>

  <span class="lamp__ring" aria-hidden="true"></span>
  <span class="w-sr" data-role="state">当前为浅色模式</span>
</div>
