<div class="pomo">
  <div class="pomo-head">
    <h2 class="pomo-title" id="pomo-title"></h2>
    <p class="pomo-cap"><span class="t-text-swap" id="pomo-cap" aria-live="polite"></span></p>
  </div>
  <div class="pomo-readout">
    <span class="t-digit-group" id="pomo-digits" aria-live="polite">25</span>
    <span class="pomo-unit">min</span>
  </div>
  <div class="pomo-slider" id="pomo-slider">
    <div class="pomo-ticks" aria-hidden="true"></div>
    <input type="range" class="pomo-range" id="pomo-range" min="15" max="60" step="1" value="25" aria-labelledby="pomo-title">
  </div>
  <button type="button" class="pomo-start" id="pomo-start" aria-pressed="false"><span class="t-text-swap" id="pomo-start-label"></span></button>
</div>
