<div class="t-data stat">
  <header class="t-data__head">
    <div>
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">本周专注</h2>
    </div>
    <span class="t-data__meta" data-field="meta"></span>
  </header>
  <div class="t-data__body stat__body">
    <p class="stat__value"><span data-field="value">128</span><span class="stat__unit" data-field="unit">分钟</span></p>
    <p class="stat__trend" data-field="trend">
      <span class="stat__delta" data-field="delta">+12%</span>
      <span class="stat__note" data-field="note">较上周</span>
    </p>
    <p class="stat__caption" data-field="caption">周一至周五 · 专注统计</p>
  </div>
</div>
