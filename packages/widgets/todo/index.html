<div class="todo">
  <header class="todo-head">
    <h2 class="todo-title" id="todo-title"></h2>
    <p class="todo-count" id="todo-count" aria-live="polite"></p>
  </header>
  <div class="todo-progress" aria-hidden="true"><span class="todo-progress-bar" id="todo-progress"></span></div>
  <ul class="todo-list" id="todo-list"></ul>
  <p class="todo-empty" id="todo-empty" hidden></p>
  <div class="todo-add">
    <input class="todo-input" id="todo-input" type="text" maxlength="200" autocomplete="off" enterkeyhint="done">
    <button class="todo-submit" id="todo-submit" type="button"><span class="todo-plus" aria-hidden="true"></span></button>
  </div>
</div>
