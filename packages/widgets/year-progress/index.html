<div class="t-data t-data--split year-card">
  <header class="t-data__head">
    <div>
      <p class="t-data__kicker" data-field="kicker"></p>
      <h2 class="t-data__title" data-field="title">年度进度</h2>
    </div>
    <span class="t-data__meta" data-field="meta"></span>
  </header>
  <div class="t-data__body year-card__body">
    <div class="year-card__face">
      <p class="year-card__percent"><span class="t-digit-group" data-role="percent">0</span><span class="year-card__unit" aria-hidden="true">%</span></p>
      <div class="year-card__track" role="progressbar" aria-label="年度进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-role="track">
        <span class="year-card__fill" data-role="fill"></span>
        <span class="year-card__tick" style="left: 25%"></span>
        <span class="year-card__tick" style="left: 50%"></span>
        <span class="year-card__tick" style="left: 75%"></span>
      </div>
      <div class="year-card__quarters" aria-hidden="true">
        <span>Q1</span>
        <span>Q2</span>
        <span>Q3</span>
        <span>Q4</span>
      </div>
    </div>
    <p class="year-card__note" data-field="note"></p>
  </div>
</div>
